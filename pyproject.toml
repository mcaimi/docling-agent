[project]
name = "doc-ingestion-agent"
version = "0.2.0"
description = "LangGraph-based Agent that uses Docling to Convert, Chunk and Embed documents for AI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "docling>=2.93.0",
    "langchain>=1.3.1",
    "langgraph>=1.2.0",
    "mlflow>=3.12.0",
    "openai>=2.30.0",
    "python-dotenv>=1.2.2",
]
