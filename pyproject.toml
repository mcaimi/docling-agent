[project]
name = "doc-ingestion-agent"
version = "0.2.0"
description = "LangGraph-based Agent that uses Docling to Convert, Chunk and Embed documents for AI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "docling>=2.142.1",
    "httpx2>=2.16.0",
    "langchain>=1.4.7",
    "langgraph>=1.2.16",
    "mlflow>=3.17.2",
    "openai>=3.37.0",
    "python-dotenv>=1.2.2",
    "tenacity>=9.0.0",
]

[project.optional-dependencies]
chroma = ["langchain-chroma>=1.1.0"]
milvus = ["langchain-milvus>=0.4.0"]
vector-stores = [
    "langchain-chroma>=1.1.0",
    "langchain-milvus>=0.4.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "requests>=2.31.0",
]
